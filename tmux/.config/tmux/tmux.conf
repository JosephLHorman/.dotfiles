bind r source-file ~/.config/tmux/tmux.conf # Reload config

source-file ~/.config/tmux/carbonfox-theme.conf  # Add theme file

# Replace prefix bind
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

# From nvim
set-option -sg escape-time 10

# Start windows/panes at 1, not 0, and keep numbering contiguous on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color passthrough (works underneath whatever default-terminal is set to)
set -ag terminal-overrides ",xterm-256color:RGB"

# Open new panes in the current pane's path instead of $HOME
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-style pane resizing using capitals
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle # To switch, press C-v *after* entering selection mode with v

# Yank to the system clipboard. Each if-shell that matches rebinds y, so these run
# least-preferred first and the last match wins: WSL -> clip.exe, Wayland -> wl-copy,
# X11 -> xclip, macOS -> pbcopy. If none exist, y keeps tmux's own buffer only.
if-shell 'command -v xclip'    'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
if-shell 'command -v wl-copy'  'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'
if-shell 'command -v pbcopy'   'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
if-shell 'command -v clip.exe' 'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"'

# Monitoring/Bell preferences
set -g display-time 2000 # Override from tmux-sensible
set -g monitor-silence 0 # Disable inactivity monitoring
set -g monitor-activity on # Update pane flag for activity
set -g visual-activity on # Send status notifs instead of audible bells

# TPM Configuration (Use <leader>I to access):
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
